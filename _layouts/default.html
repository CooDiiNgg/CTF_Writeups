<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.summary | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  {% if page.math %}
  <script>window.MathJax = {tex: {inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]'], ['$$', '$$']]}, options: {skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']}};</script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
  {% endif %}
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header class="site-header"><a href="{{ '/' | relative_url }}">{{ site.title | escape }}</a><a class="repo" href="https://github.com/CooDiiNgg/CTF_Writeups">GitHub ↗</a></header>
  <main id="content">{{ content }}</main>
  <footer>Written to understand. Kept to remember.</footer>
</body>
</html>
